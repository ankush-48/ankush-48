<text x="44" y="51" fill="#bd9cff" font-size="16" font-weight="700">01   /   FLAGSHIP PROJECT</text><text x="40" y="132" fill="#f6f2ff" font-size="76" font-weight="750">Relay</text><text x="45" y="176" fill="#f6f2ff" font-size="28" font-weight="650">Offline-first payment simulator</text><text x="45" y="218" fill="#b5aec4" font-size="20" font-weight="400">Queue offline. Forward securely. Confirm at the ledger.</text><text x="45" y="286" fill="#59e7c5" font-size="15" font-weight="650">JAVA 17   /   SPRING BOOT   /   INDEXEDDB   /   H2</text><rect x="605" y="53" width="300" height="238" rx="16" fill="#15121e" stroke="#322840"/><text x="634" y="90" fill="#b5aec4" font-size="14" font-weight="650">TRANSACTION STATUS</text><text x="634" y="118" fill="#bd9cff" font-size="16" font-weight="700">01  QUEUED</text><text x="634" y="138" fill="#b5aec4" font-size="14" font-weight="400">Saved in the browser</text><text x="634" y="169" fill="#e6a1eb" font-size="16" font-weight="700">02  FORWARDED</text><text x="634" y="189" fill="#b5aec4" font-size="14" font-weight="400">Encrypted envelope in transit</text><text x="634" y="220" fill="#59e7c5" font-size="16" font-weight="700">03  CONFIRMED</text><text x="634" y="240" fill="#b5aec4" font-size="14" font-weight="400">Ledger settlement received</text>
