<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406" role="img">
<title>Relay architecture from browser queue to simulated ledger</title>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#090b10"/><stop offset="1" stop-color="#181022"/></linearGradient>
<linearGradient id="signal"><stop stop-color="#bd9cff"/><stop offset="1" stop-color="#59e7c5"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#362742" opacity=".46"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#b5aec4"/></marker>
</defs>
<rect x="1" y="1" width="958" height="404" rx="22" fill="url(#surface)" stroke="#322840"/>
<rect x="2" y="2" width="956" height="402" rx="21" fill="url(#grid)"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<text x="39" y="48" fill="#bd9cff" font-size="16" font-weight="700">02   /   SYSTEM ARCHITECTURE</text><text x="39" y="86" fill="#f6f2ff" font-size="30" font-weight="700">Follow a payment request</text><text x="39" y="115" fill="#b5aec4" font-size="16" font-weight="400">The moving dot illustrates the happy path through the simulator.</text><rect x="38" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="49" y="173" fill="#bd9cff" font-size="12" font-weight="750">01   BROWSER</text><text x="49" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Save locally</text><text x="49" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">IndexedDB queue</text><path d="M201 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="218" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="229" y="173" fill="#e6a1eb" font-size="12" font-weight="750">02   SPRING BOOT</text><text x="229" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Seal packet</text><text x="229" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">AES-GCM + RSA-OAEP</text><path d="M381 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="398" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="409" y="173" fill="#e6a1eb" font-size="12" font-weight="750">03   VIRTUAL MESH</text><text x="409" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Forward</text><text x="409" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Peers route the packet</text><path d="M561 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="578" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="589" y="173" fill="#ffcd88" font-size="12" font-weight="750">04   BRIDGE</text><text x="589" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Validate</text><text x="589" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Freshness + duplicate check</text><path d="M741 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="758" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="769" y="173" fill="#59e7c5" font-size="12" font-weight="750">05   H2 LEDGER</text><text x="769" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Settle</text><text x="769" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Atomic balance update</text><path d="M48 281H908" stroke="url(#signal)" stroke-width="2" stroke-dasharray="4 6"/><circle cx="48" cy="281" r="5" fill="#59e7c5"><animate attributeName="cx" values="48;908;908" keyTimes="0;.85;1" dur="6s" repeatCount="indefinite"/></circle><rect x="38" y="310" width="432" height="68" rx="16" fill="#15121e" stroke="#322840"/><rect x="486" y="310" width="432" height="68" rx="16" fill="#15121e" stroke="#322840"/><text x="54" y="336" fill="#bd9cff" font-size="13" font-weight="750">RETRY</text><text x="54" y="359" fill="#b5aec4" font-size="15" font-weight="400">Transient failure keeps the local request queued.</text><text x="502" y="336" fill="#ffcd88" font-size="13" font-weight="750">REJECT OR IGNORE</text><text x="502" y="359" fill="#b5aec4" font-size="14" font-weight="400">Stale, invalid, or duplicate packets cannot settle again.</text>
</g>
</svg>
