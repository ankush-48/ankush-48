<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img">
<title>Relay architecture from browser queue to simulated ledger</title>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#090b10"/><stop offset="1" stop-color="#181022"/></linearGradient>
<linearGradient id="signal"><stop stop-color="#bd9cff"/><stop offset="1" stop-color="#59e7c5"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#362742" opacity=".46"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#b5aec4"/></marker>
</defs>
<rect x="1" y="1" width="958" height="248" rx="22" fill="url(#surface)" stroke="#322840"/>
<rect x="2" y="2" width="956" height="246" rx="21" fill="url(#grid)"/>
<g font-family="system-ui, Segoe UI, sans-serif">
<text x="39" y="47" fill="#f6f2ff" font-size="26" font-weight="700">Relay payment flow</text><g transform="translate(0 -80)"><rect x="38" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="49" y="173" fill="#bd9cff" font-size="12" font-weight="750">01   BROWSER</text><text x="49" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Save locally</text><text x="49" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">IndexedDB queue</text><path d="M201 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="218" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="229" y="173" fill="#e6a1eb" font-size="12" font-weight="750">02   SPRING BOOT</text><text x="229" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Seal packet</text><text x="229" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">AES-GCM + RSA-OAEP</text><path d="M381 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="398" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="409" y="173" fill="#e6a1eb" font-size="12" font-weight="750">03   VIRTUAL MESH</text><text x="409" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Forward</text><text x="409" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Peers route the packet</text><path d="M561 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="578" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="589" y="173" fill="#ffcd88" font-size="12" font-weight="750">04   BRIDGE</text><text x="589" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Validate</text><text x="589" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Freshness + duplicate check</text><path d="M741 204h15" stroke="#b5aec4" marker-end="url(#arrow)"/><rect x="758" y="148" width="162" height="111" rx="16" fill="#15121e" stroke="#322840"/><text x="769" y="173" fill="#59e7c5" font-size="12" font-weight="750">05   H2 LEDGER</text><text x="769" y="204" fill="#f6f2ff" font-size="19" font-weight="700">Settle</text><text x="769" y="230" fill="#b5aec4" font-size="11.5" font-weight="400">Atomic balance update</text><path d="M48 281H908" stroke="url(#signal)" stroke-width="2" stroke-dasharray="4 6"/><circle cx="48" cy="281" r="5" fill="#59e7c5"><animate attributeName="cx" values="48;908;908" keyTimes="0;.85;1" dur="6s" repeatCount="indefinite"/></circle></g>
<text x="39" y="229" fill="#bd9cff" font-size="14">Offline → queued for retry</text>
<text x="300" y="229" fill="#ffcd88" font-size="14">Invalid or duplicate → stopped</text>
<text x="640" y="229" fill="#59e7c5" font-size="14">Ledger settles → confirmed</text>
</g>
</svg>
