<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img">
<title>Relay: Offline-first payment simulator</title>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#090b10"/><stop offset="1" stop-color="#1d1426"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#322840" opacity=".45"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#685578"/></marker>
</defs>
<rect x="1" y="1" width="518" height="518" rx="22" fill="url(#surface)" stroke="#392e46"/>
<rect x="2" y="2" width="516" height="516" rx="21" fill="url(#grid)"/>
<g font-family="system-ui, Segoe UI, sans-serif"><text x="36" y="53" font-size="15" fill="#59e7c5" font-weight="700">01  /  FLAGSHIP</text><text x="36" y="113" font-size="36" fill="#f6f2ff" font-weight="750">Relay</text><text x="36" y="148" font-size="18" fill="#b5aec4" font-weight="400">Offline-first payment simulator</text><path d="M64 235V408" stroke="#685578" stroke-width="2" marker-end="url(#arrow)"/><rect x="94" y="185" width="390" height="64" rx="14" fill="#17131f" stroke="#392e46"/><circle cx="64" cy="217" r="16" fill="#21192d" stroke="#59e7c5"/><text x="59" y="222" font-size="14" fill="#59e7c5" font-weight="700">1</text><text x="116" y="224" font-size="21" fill="#f6f2ff" font-weight="650">Offline queue</text><rect x="94" y="271" width="390" height="64" rx="14" fill="#17131f" stroke="#392e46"/><circle cx="64" cy="303" r="16" fill="#21192d" stroke="#59e7c5"/><text x="59" y="308" font-size="14" fill="#59e7c5" font-weight="700">2</text><text x="116" y="310" font-size="21" fill="#f6f2ff" font-weight="650">Encrypted mesh</text><rect x="94" y="357" width="390" height="64" rx="14" fill="#17131f" stroke="#392e46"/><circle cx="64" cy="389" r="16" fill="#21192d" stroke="#59e7c5"/><text x="59" y="394" font-size="14" fill="#59e7c5" font-weight="700">3</text><text x="116" y="396" font-size="21" fill="#f6f2ff" font-weight="650">Ledger settlement</text><circle cx="64" cy="217" r="5" fill="#59e7c5"><animate attributeName="cy" values="217;303;389;389" keyTimes="0;.38;.76;1" dur="5s" repeatCount="indefinite"/></circle><path d="M36 466H484" stroke="#392e46"/><text x="36" y="502" font-size="17" fill="#59e7c5" font-weight="700">Queued requests sync on reconnect</text></g>
</svg>
