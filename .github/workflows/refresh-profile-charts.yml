name: Refresh profile charts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-profile-charts.yml
      - scripts/github-charts.json
      - scripts/refresh_github_charts.py
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-chart-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh cached SVGs
        run: python3 scripts/refresh_github_charts.py
      - name: Publish updated charts
        run: |
          git add -- assets/github
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile chart snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
